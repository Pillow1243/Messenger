name: Export Room schema

# Room generates app/schemas/*.json during KSP. The files must live in the repository so that every
# migration is reviewable and so the CI staleness check has something to compare against. Because a
# workflow cannot download its own artifacts in every environment, this job regenerates the schema
# and commits it back to the branch it was dispatched for.
#
# It never touches `main` unless it is dispatched for `main`, and it only ever adds files under
# app/schemas.

on:
  # Runs on every push (and on demand). It only creates a commit when Room actually produced a
  # different schema, and commits pushed with GITHUB_TOKEN do not re-trigger workflows, so this
  # cannot loop.
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schema-export-${{ github.event.inputs.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout the target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.5.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.0.1

      - name: Generate the schema
        run: |
          set -e
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon --console=plain :app:kspDebugKotlin
          find app/schemas -name '*.json' | sort | head -20
          test -n "$(find app/schemas -name '*.json' -print -quit)" || {
            echo "::error::Room produced no schema files"; exit 1; }

      - name: Commit the schema if it changed
        run: |
          set -e
          git config user.name "schema-bot"
          git config user.email "schema-bot@users.noreply.github.com"
          git add app/schemas
          if git diff --cached --quiet; then
            echo "Schema unchanged."
            exit 0
          fi
          git commit -m "chore(db): export Room schema"
          git push origin "HEAD:${{ github.event.inputs.ref || github.ref_name }}"
