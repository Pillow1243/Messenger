name: CI

# Continuous integration: unit tests, lint, schema export and an installable demo APK.
# Every action is pinned to a commit SHA so a compromised tag cannot inject code into the
# pipeline. The demo APK is only ever published from `main` (see the demo-release job) - a push
# to a feature branch must never overwrite the shared `demo-latest` prerelease.

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.parallel=true"
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  verify:
    name: Test, lint and package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.5.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Point Gradle at the preinstalled SDK
        run: |
          set -e
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
              "platforms;android-34" "build-tools;34.0.0"
          else
            echo "::warning::sdkmanager not found; relying on the image's preinstalled SDK 34"
          fi
          test -d "$ANDROID_HOME/platforms/android-34" || { echo "::error::Android SDK 34 missing"; exit 1; }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.0.1

      # Cheap, dependency-free checks that catch the classic "forgot to translate" regression
      # before Gradle even starts.
      - name: English / Persian string parity
        run: ./tools/check_string_parity.sh

      - name: No committed credentials
        run: ./tools/check_no_secrets.sh

      - name: Third-party licence inventory
        run: python3 tools/license_inventory.py

      # The APK ships THIRD_PARTY_NOTICES.md so attribution is reachable from inside the app;
      # this fails if the generated asset and the repository notices file have drifted apart.
      - name: In-app licence asset is current
        run: python3 tools/build_licence_asset.py --check

      # Gradle's own log is only reachable through the artifact blob, which some CI
      # environments cannot fetch. Re-emitting the compiler/lint errors as workflow
      # annotations makes the failure readable directly from the check run.
      - name: Unit tests
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon --console=plain testDebugUnitTest > test.log 2>&1; then
            grep -E "^e: |^w: .*error|error:|FAILED|Execution failed|Caused by" test.log \
              | head -25 | cut -c1-900 | while IFS= read -r line; do
                echo "::error title=gradle::$line"
              done
            tail -30 test.log
            exit 1
          fi
          tail -5 test.log

      - name: Lint
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon --console=plain lintDebug > lint.log 2>&1; then
            grep -E "Error:|error:" lint.log | head -25 | cut -c1-900 | while IFS= read -r line; do
              echo "::error title=lint::$line"
            done
            grep -E "^\s+[0-9]+ errors?, [0-9]+ warnings?" lint.log | head -5
            tail -30 lint.log
            exit 1
          fi
          tail -5 lint.log

      - name: Assemble debug, demo and release
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon --console=plain assembleDebug assembleDemo -PdemoSign=true \
              > assemble.log 2>&1; then
            grep -E "^e: |error:|FAILED|Execution failed|Caused by" assemble.log \
              | head -25 | cut -c1-900 | while IFS= read -r line; do
                echo "::error title=assemble::$line"
              done
            tail -30 assemble.log
            exit 1
          fi
          tail -5 assemble.log

      - name: Checksums and size report
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/offlinemesh-debug.apk
          if [ -f app/build/outputs/apk/demo/app-demo.apk ]; then
            cp app/build/outputs/apk/demo/app-demo.apk artifacts/offlinemesh-demo-signed.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/offlinemesh-demo-signed.apk
          fi
          # Dependency inventory + attribution notice travel with the binaries so a recipient can
          # see exactly what is inside the APK and under which licences.
          ./gradlew --no-daemon --console=plain :app:dependencies \
            --configuration releaseRuntimeClasspath > artifacts/dependency-graph.txt || true
          cp THIRD_PARTY_NOTICES.md artifacts/
          cd artifacts && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.3
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
            test.log
            lint.log
            assemble.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.3
        with:
          name: messenger-apks
          path: artifacts/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload exported Room schemas
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.3
        with:
          name: room-schemas
          path: app/schemas/**
          if-no-files-found: warn
          retention-days: 90

      - name: Fail if the committed Room schema is stale
        if: always() && hashFiles('app/schemas/**') != ''
        run: |
          # Generated files are untracked on a fresh checkout, so `git diff` alone would miss
          # them; --porcelain catches both modifications and new schema files.
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            echo "::error::Exported Room schema changed - commit app/schemas so migrations can be reviewed."
            git status --porcelain -- app/schemas
            git diff --stat -- app/schemas
            exit 1
          fi

  instrumented:
    name: Android instrumentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.5.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Point Gradle at the preinstalled SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.0.1

      # The hosted runner is a nested VM; the emulator needs /dev/kvm permission for x86_64.
      # Both commands are allowed to fail here: on images where udev rules are not writable the
      # permission is usually already correct, and a hard failure here would mask the real cause.
      - name: Enable KVM
        run: |
          set -x
          sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null <<'RULE'
          KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"
          RULE
          sudo udevadm control --reload-rules || echo "::warning::udevadm control failed"
          sudo udevadm trigger --name-match=kvm || echo "::warning::udevadm trigger failed"
          ls -l /dev/kvm || echo "::warning::/dev/kvm is absent on this runner"

      # Compiling the instrumentation APK is cheap and catches test-source errors long before an
      # emulator boots. Gradle's own errors are surfaced as annotations so a failure is readable
      # from the checks API even when the job log is not.
      - name: Compile debug + instrumentation APKs
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon --console=plain -PextraAbis=x86_64 \
              assembleDebug assembleDebugAndroidTest 2>&1 | tee build.log; then
            grep -E "^e: |error:|FAILURE:" build.log | head -25 |
              while IFS= read -r line; do echo "::error title=Gradle::${line}"; done
            exit 1
          fi

      # These tests cover what JVM tests cannot: SQLCipher's native library, the real Keystore
      # wrap, and the on-disk encryption property (no SQLite header, no plaintext canary).
      #
      # The emulator is driven explicitly rather than through a third-party action: the action
      # this repository used to pin failed during its own SDK installation, and its diagnostics
      # only ever appeared in a job log. Every command below is wrapped so a failure becomes a
      # check annotation with the tail of the relevant log attached.
      - name: Install emulator and system image
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          log=/tmp/sdk-install.log
          { yes | "$SDKMANAGER" --licenses; } >"$log" 2>&1 || true
          if ! "$SDKMANAGER" --install "platform-tools" "emulator" \
              "system-images;android-30;google_apis;x86_64" >>"$log" 2>&1; then
            tail -c 3000 "$log" | while IFS= read -r line; do echo "::error title=SDK install::${line}"; done
            exit 1
          fi
          tail -3 "$log"

      - name: Create AVD
        run: |
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          [ -x "$AVDMANAGER" ] || AVDMANAGER="$(command -v avdmanager)"
          log=/tmp/avd-create.log
          if ! echo no | "$AVDMANAGER" create avd --force --name ci-api30 \
              --package "system-images;android-30;google_apis;x86_64" \
              --device pixel_5 >"$log" 2>&1; then
            tail -c 3000 "$log" | while IFS= read -r line; do echo "::error title=AVD::${line}"; done
            exit 1
          fi
          tail -3 "$log"

      - name: Boot emulator
        run: |
          set -x
          adb start-server
          nohup "$ANDROID_HOME/emulator/emulator" -avd ci-api30 -port 5554 \
            -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect \
            >/tmp/emulator.log 2>&1 &
          boot=""
          for _ in $(seq 1 90); do
            boot=$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$boot" = "1" ] && break
            if ! pgrep -f "qemu-system" >/dev/null 2>&1; then
              echo "::error title=Emulator::the emulator process exited during boot"
              tail -c 3000 /tmp/emulator.log |
                while IFS= read -r line; do echo "::error title=Emulator::${line}"; done
              exit 1
            fi
            sleep 5
          done
          if [ "$boot" != "1" ]; then
            echo "::error title=Emulator::the emulator did not finish booting within 450s"
            tail -c 3000 /tmp/emulator.log |
              while IFS= read -r line; do echo "::error title=Emulator::${line}"; done
            exit 1
          fi
          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0
          adb -s emulator-5554 shell pm list packages >/dev/null
          echo "emulator booted: $(adb -s emulator-5554 shell getprop ro.build.version.sdk)"

      - name: Run instrumentation tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain -PextraAbis=x86_64 connectedDebugAndroidTest \
            2>&1 | tee device.log || {
              grep -E "^e: |error:|FAILURE:|There were failing tests|Tests on|junit.framework" device.log |
                head -40 | while IFS= read -r line; do echo "::error title=Instrumentation::${line}"; done
              exit 1
            }

      - name: Stop emulator
        if: always()
        run: adb -s emulator-5554 emu kill || true

      # Emitting the JUnit results as annotations makes the outcome readable from the checks API,
      # and a missing report becomes an explicit failure instead of a silent "no artifacts"
      # warning, so a green run always means the tests really ran.
      - name: Summarise instrumentation results
        if: always()
        run: |
          shopt -s nullglob globstar
          results=(app/build/outputs/androidTest-results/**/*.xml)
          if [ ${#results[@]} -eq 0 ]; then
            echo "::error title=Instrumentation::no JUnit result files were produced; the emulator or the test run failed before reporting"
            exit 1
          fi
          sum_attr() { grep -ho "$1=\"[0-9]*\"" "${results[@]}" | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}'; }
          failures=$(sum_attr failures)
          tests=$(sum_attr tests)
          echo "instrumentation: ${tests} tests, ${failures} failures/errors"
          if [ "${failures:-1}" -gt 0 ] || [ "${tests:-0}" -eq 0 ]; then
            grep -h -A3 '<failure\|<error' "${results[@]}" | head -40 |
              while IFS= read -r line; do echo "::error title=Instrumentation::${line}"; done
            exit 1
          fi

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.3
        with:
          name: instrumentation-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 14

  demo-release:
    name: Publish demo build (main only)
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: demo-release
      cancel-in-progress: false
    steps:
      - name: Download APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        with:
          name: messenger-apks
          path: artifacts

      - name: Publish demo-latest prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.0.9
        with:
          tag_name: demo-latest
          name: Messenger - demo build
          prerelease: true
          make_latest: "false"
          body: |
            Automatically built from `${{ github.sha }}` on `main`.

            **These APKs are signed with the public Android debug key.** That key is public, so
            the files are convenient demo builds - not a trusted distribution channel. The
            production channel is published separately from `v*` tags with a private key.

            Minimum Android version: 8.0 (API 26). Verify the download against `SHA256SUMS.txt`.
          files: |
            artifacts/offlinemesh-debug.apk
            artifacts/offlinemesh-demo-signed.apk
            artifacts/SHA256SUMS.txt
