name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The ubuntu images ship a ready-made SDK; using it avoids an extra download step.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Point Gradle at the SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
              "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain testDebugUnitTest 2>&1 | tee build.log

      - name: Assemble debug + release
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain assembleDebug assembleRelease 2>&1 | tee -a build.log

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/offlinemesh-debug.apk
          cp app/build/outputs/apk/release/app-release.apk artifacts/offlinemesh-demo-signed.apk
          ls -lh artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: offlinemesh-apks
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      # Compiler errors are mirrored into a commit comment so they stay readable through the
      # REST API (the Actions log endpoint is not always reachable from every environment).
      - name: Extract the interesting part of the log
        if: failure()
        run: |
          grep -aE "^(e|w): |^> Task .* FAILED|error:|What went wrong|Caused by:|Execution failed|Could not (resolve|find|download)|FAILURE" build.log | head -300 > diag.txt || true
          if [ ! -s diag.txt ]; then tail -c 20000 build.log > diag.txt; fi
          head -60 diag.txt

      - name: Mirror diagnostics into a commit comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let diag = '';
            try { diag = fs.readFileSync('diag.txt', 'utf8'); } catch (e) { diag = '(no diag.txt)'; }
            const fence = String.fromCharCode(96).repeat(3);
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '### CI diagnostics\n\n' + fence + '\n' + diag + '\n' + fence
            });

      - name: Publish demo-signed APKs as a GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demo-latest
          name: Offline Mesh - demo build
          prerelease: true
          make_latest: "false"
          body: |
            Automatically built from `${{ github.sha }}` on `${{ github.ref_name }}`.

            **These APKs are signed with the public Android debug key.** Anyone can sign a
            package with that key, so treat the files as convenient demo builds, not as a
            trusted distribution channel. Install: allow "install unknown apps" for your
            browser/file manager, then open `offlinemesh-demo-signed.apk`.

            Minimum Android version: 8.0 (API 26).
          files: |
            artifacts/offlinemesh-debug.apk
            artifacts/offlinemesh-demo-signed.apk
